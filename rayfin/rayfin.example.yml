id: control-tower-settlement-analysis
name: Settlement Control Tower
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
  data:
    enabled: false
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: true
    buildCommand: npm run build
    auth:
      type: application
secrets:
  - name: DATA_AGENT_MCP_URL
    description: Published Fabric data agent MCP endpoint
connectors:
  - name: settlementmodel
    type: fabric-semanticmodel
    config:
      workspaceId: 00000000-0000-0000-0000-000000000000
      itemId: 00000000-0000-0000-0000-000000000000
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery